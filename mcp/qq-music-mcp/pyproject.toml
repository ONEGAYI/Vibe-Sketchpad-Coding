[project]
name = "qq-music-mcp"
version = "0.1.0"
description = "Local stdio MCP for managing QQ Music playlists on Windows"
requires-python = ">=3.11,<3.15"
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=1.27,<2",
    "pydantic>=2,<3",
    "pywin32>=311; sys_platform == 'win32'",
    "qqmusic-api-python==0.9.0",
]

[project.scripts]
qq-music-mcp = "qq_music_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qq_music_mcp"]
